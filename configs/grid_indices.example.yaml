# Change ONLY this parameter to select the input variable SPEI_1 or SPEI_3.
spei_scale: 3
mode: grid
input: local/monthly_indices.nc
output: output/grid_bdhei.nc
sti_variable: STI
time_dimension: time
latitude_dimension: latitude
longitude_dimension: longitude
months: [6, 7, 8]
overwrite: false
input_engine: auto
output_engine: netcdf4
output_format: NETCDF4
compression_level: 4
